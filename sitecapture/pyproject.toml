[project]
name = "sitecapture"
version = "0.2.0"
description = "360 site capture: upload walks, place them on PDF drawings, track progress over time."
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "numpy>=1.26",
    "httpx>=0.27",
    "anthropic>=1.0",
    "markdown>=3.5",
    # Postgres driver and a bundled ffmpeg, so serverless hosts (Vercel) work
    # without system packages.
    "psycopg[binary]>=3.1",
    "imageio-ffmpeg>=0.5",
]
requires-python = ">=3.12"

[project.optional-dependencies]
bim = ["ifcopenshell>=0.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sitecapture*"]

[tool.setuptools.package-data]
sitecapture = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
