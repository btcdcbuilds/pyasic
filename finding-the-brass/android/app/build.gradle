plugins {
    id "com.android.application"
}

android {
    namespace "com.findingthebrass.game"
    compileSdk 34

    defaultConfig {
        applicationId "com.findingthebrass.game"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    // The game itself is the HTML5 build in ../../web, packaged as the APK's assets.
    sourceSets {
        main {
            assets.srcDirs = ["../../web"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
